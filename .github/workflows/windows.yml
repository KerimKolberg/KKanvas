name: Windows app

# Tests the Windows app and builds its installer on every push. A version tag (v1.2 …) also puts
# the installer on a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The same FFmpeg as in tools/ffmpeg on the PC, byte for byte, so the installers built here
      # and there are the same. To update FFmpeg, change the version and both checksums together.
      - name: FFmpeg for Windows (gyan.dev build with AMD AMF, pinned)
        shell: pwsh
        env:
          FFMPEG_VERSION: 9.0.2
          FFMPEG_SHA256: 3256173f3f8bffd7df12227c68adf68025edb1832273a9530688a7bb1ed8edec
          FFPROBE_SHA256: f0d36ecbbdd3bcfac3efa078c96c7271c2e68b3810595552ac3b7f17e9a65c52
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $dir = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1
          foreach ($check in @(@("ffmpeg.exe", $env:FFMPEG_SHA256), @("ffprobe.exe", $env:FFPROBE_SHA256))) {
            $hash = (Get-FileHash "$($dir.FullName)\bin\$($check[0])" -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $check[1]) { throw "$($check[0]) isn't the expected build: $hash" }
          }
          "FFMPEG_DIR=$($dir.FullName)" >> $env:GITHUB_ENV

      - name: Test, and build the installer
        run: ./gradlew :shared:desktopTest :desktopApp:test :desktopApp:packageExe --console=plain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-screens
          path: desktopApp/build/screens
          retention-days: 3

      # Kept for a few days only: the installer is big, and the storage is shared with the APKs.
      - uses: actions/upload-artifact@v4
        with:
          name: kk-Squareify-windows-installer
          path: desktopApp/build/compose/binaries/main/exe/*.exe
          retention-days: 3

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem desktopApp/build/compose/binaries/main/exe/*.exe | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $installer.FullName --title "kk-Squareify ${{ github.ref_name }}" --generate-notes
