name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The private signing key, from the repository's secrets. Where they aren't available
      # (a fork, a pull request from one) the build falls back to the checked-in debug key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KKANVAS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kkanvas.jks"
            echo "KKANVAS_KEYSTORE=$RUNNER_TEMP/kkanvas.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK and run unit tests
        env:
          KKANVAS_KEYSTORE_PASSWORD: ${{ secrets.KKANVAS_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease testDebugUnitTest :shared:desktopTest --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: kkanvas-apk
          path: app/build/outputs/apk/release/app-release.apk

      # The Windows build adds its installer to the same release; whichever comes first creates it.
      # Only with the private key: an APK signed with the public debug key isn't for publishing.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && env.KKANVAS_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="kkanvas-${GITHUB_REF_NAME#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "kkanvas $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
